    <circle cx="76" cy="39" r="18" fill="url(#gold)"/>
    <path d="M28 115c15-32 31-48 48-48s34 16 48 48" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 115h72M52 91l-12 24M76 67v48M100 91l12 24" stroke="#f8f7ff" stroke-width="7" stroke-linecap="round"/>
