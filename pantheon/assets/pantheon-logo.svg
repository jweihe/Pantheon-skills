<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" role="img" aria-labelledby="title desc">
  <title id="title">Pantheon Skills logo</title>
  <desc id="desc">Pantheon Skills wordmark with a temple-like skill forge mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111018"/>
      <stop offset="0.55" stop-color="#1d1a2b"/>
      <stop offset="1" stop-color="#30264a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
