      <stop offset="1" stop-color="#c58a2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="920" height="240" rx="44" fill="url(#bg)"/>
  <circle cx="812" cy="48" r="94" fill="#f5c86a" opacity="0.08"/>
  <circle cx="90" cy="206" r="116" fill="#5c7cfa" opacity="0.08"/>
