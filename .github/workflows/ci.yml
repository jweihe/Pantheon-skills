name: CI

on:
  push:
  pull_request:

jobs:
  pantheon:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit bundled skill
        run: make audit

      - name: Run demo experiment
        run: make demo

      - name: Run local benchmark
        run: make benchmark
